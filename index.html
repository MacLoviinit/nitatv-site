<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NitaTV</title>
<meta name="description" content="NitaTV — lecteur pour Android TV, tablette et téléphone">
<style>
  :root { --fond:#101320; --texte:#e9ebf2; --doux:#a3a8b8; --accent:#00c1ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fond); color:var(--texte); display:flex; align-items:center;
         justify-content:center; text-align:center;
         font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
  h1 { font-size:clamp(2.6rem, 9vw, 4.2rem); margin:0; font-weight:600; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .trait { width:120px; height:3px; background:var(--accent); margin:12px auto 24px; border-radius:2px; }
  p { color:var(--doux); margin:0 0 8px; }
  footer { margin-top:40px; font-size:.9rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Nita<span>TV</span></h1>
  <div class="trait"></div>
  <p>Un lecteur pour Android TV, tablette et téléphone.</p>
  <p>Bientôt sur Google Play.</p>
  <footer><a href="confidentialite.html">Confidentialité · Privacy</a> · <a href="https://play.google.com/store/account/subscriptions?sku=nitatv_abonnement&amp;package=tv.nita.app">Gérer mon abonnement · Manage my subscription</a> · <a href="mailto:contact@nita.tv">contact@nita.tv</a></footer>
</main>
</body>
</html>
