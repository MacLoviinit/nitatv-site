<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>NitaTV — Se connecter sur la télé · Sign in on the TV</title>
<link rel="stylesheet" href="verre.css">
</head>
<body class="verre-page">
<main class="chargement">
  <p class="gros-logo">NITA<b>TV</b></p>

  <div class="boite verre">
    <noscript><p class="etat ko">Cette page a besoin de JavaScript pour vous connecter avec Google.
    · This page needs JavaScript to sign you in with Google.</p></noscript>

    <!-- « Connectez votre compte Google » (maquette, data-etape="compte") : le bouton de Google -->
    <section class="etape" id="etape-compte" hidden>
      <h3 data-t="compteTitre"></h3>
      <p data-t="compteTexte"></p>
      <div id="bouton-google" aria-live="polite"></div>
      <p class="etat" id="etat-compte" role="status" aria-live="polite" hidden></p>
      <div class="pas"><button type="button" class="bouton plein f" id="reessayer" data-t="reessayer" hidden></button></div>
    </section>

    <!-- Connecté : la télé prépare le dépôt de la playlist (contrat § 5 bis, la page interroge toutes les 3 s) -->
    <section class="etape" id="etape-attente" data-point="compte" role="status" aria-live="polite" hidden>
      <div class="connecte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></svg><b id="attente-compte"></b></div>
      <p class="attente"><span class="roue" aria-hidden="true"></span><span data-t="attente"></span></p>
      <div class="pas"><button type="button" class="bouton verre f" id="plus-tard-attente" data-t="plusTard"></button></div>
    </section>

    <!-- « Type de connexion » (maquette, data-etape="2", vue téléphone) -->
    <section class="etape" id="etape-type" hidden>
      <h3 id="type-titre" data-t="typeTitre"></h3>
      <div class="choix" role="radiogroup" aria-labelledby="type-titre">
        <button type="button" class="ligne f" role="radio" data-type="xtream"><span class="icone-carre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M8 3l4 3 4-3" stroke-linecap="round"/></svg></span><span><b data-t="xtream"></b><small data-t="xtreamSous"></small></span></button>
        <button type="button" class="ligne f" role="radio" data-type="m3u"><span class="icone-carre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9h16M9 4v5M15 4v5" stroke-linecap="round"/></svg></span><span><b data-t="m3u"></b><small data-t="m3uSous"></small></span></button>
      </div>
      <div class="pas"><button type="button" class="bouton verre f" id="plus-tard" data-t="plusTard" hidden></button><button type="button" class="bouton plein f" id="suivant" data-t="suivant"></button></div>
    </section>

    <!-- « Connexion Xtream » (data-etape="3") -->
    <form class="etape" id="etape-xtream" data-point="champs" autocomplete="off" novalidate hidden>
      <h3 data-t="xtreamTitre"></h3>
      <div class="champ"><label for="serveur" data-t="serveur"></label>
        <input class="val" type="text" id="serveur" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://exemple.com:8080"></div>
      <div class="champ"><label for="utilisateur" data-t="utilisateur"></label>
        <input class="val" type="text" id="utilisateur" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="champ"><label for="mot_de_passe" data-t="motDePasse"></label>
        <div class="val mdp"><input type="password" id="mot_de_passe" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="oeil-champ f" id="oeil" aria-pressed="false" data-t-aria="afficher"></button></div></div>
      <p class="etat" id="etat-xtream" role="status" aria-live="polite" hidden></p>
      <div class="pas"><button type="button" class="bouton verre f retour-type" data-t="retour"></button><button type="submit" class="bouton plein f" id="envoyer-xtream" data-t="envoyer"></button></div>
    </form>

    <!-- « Playlist M3U » (l'app : la page M3U de l'onboarding, au gabarit de sa voisine Xtream) -->
    <form class="etape" id="etape-m3u" data-point="champs" autocomplete="off" novalidate hidden>
      <h3 data-t="m3uTitre"></h3>
      <div class="champ"><label for="url" data-t="url"></label>
        <input class="val" type="url" id="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://exemple.com/playlist.m3u">
        <small data-t="urlAide"></small></div>
      <div class="champ"><label for="guide" data-t="guide"></label>
        <input class="val" type="url" id="guide" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://exemple.com/guide.xml">
        <small data-t="guideAide"></small></div>
      <p class="etat" id="etat-m3u" role="status" aria-live="polite" hidden></p>
      <div class="pas"><button type="button" class="bouton verre f retour-type" data-t="retour"></button><button type="submit" class="bouton plein f" id="envoyer-m3u" data-t="envoyer"></button></div>
    </form>

    <!-- la fin : « Validé ! », ou ce qui empêche d'aller plus loin -->
    <section class="etape" id="etape-fin" role="status" aria-live="polite" hidden>
      <div class="connecte"><span id="fin-icone"></span><b id="fin-titre"></b><small id="fin-texte"></small></div>
    </section>
  </div>

  <div class="points" data-ordre="compte,type,champs" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="note"><span data-t="noteConnexion"></span> <a href="confidentialite.html" data-t="confidentialite"></a></p>
</main>
<script src="depot.js"></script>
<script src="page.js"></script>
<script src="playlist.js"></script>
<script src="google.js"></script>
<script src="connexion.js"></script>
</body>
</html>
